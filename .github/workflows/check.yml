name: Check

# Every pull request and every push to main proves that catalogue.json matches catalogue.schema.json and the files
# in the repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned validator
        run: python -m pip install --no-deps --require-hashes -r .github/requirements-check.txt

      - name: Check the catalogue
        run: python .github/bin/check-catalogue.py
